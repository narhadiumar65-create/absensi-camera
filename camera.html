<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera Absensi - SD Negeri Maba</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#263238;padding:20px}.wrap{max-width:820px;margin:auto}.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{margin:0 0 6px;color:#0d47a1;font-size:22px}p{color:#607d8b}.camera{background:#111;border-radius:12px;overflow:hidden;position:relative;min-height:420px;display:flex;align-items:center;justify-content:center}video{width:100%;max-height:70vh;object-fit:cover;display:block;transform:scaleX(-1)}.status{margin-top:14px;padding:12px;border-radius:8px;background:#eef4ff;font-weight:bold}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold}.primary{background:#1565c0;color:#fff}.success{background:#2e7d32;color:#fff}.danger{background:#c62828;color:#fff}.muted{background:#607d8b;color:#fff}.hidden{display:none}.note{font-size:13px;color:#78909c;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<h1>📷 Kamera Absensi SD Negeri Maba</h1>
<p id="modeText">Menghubungkan ke aplikasi utama...</p>
<div class="camera"><video id="video" autoplay muted playsinline></video></div>
<div class="status" id="status">Menyiapkan kamera...</div>
<div class="actions">
<button class="btn success hidden" id="captureBtn">🙂 Ambil 3 Sampel Wajah</button>
<button class="btn danger" id="stopBtn">⛔ Matikan Kamera</button>
</div>
<div class="note">Jangan tutup jendela ini selama absensi. Untuk pendaftaran wajah, pastikan hanya satu wajah terlihat dan tekan tombol sampel.</div>
</div></div>
<script>
const MODEL_URL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const params=new URLSearchParams(location.search); const mode=params.get('mode')==='register'?'register':'attendance';
const video=document.getElementById('video'); const statusEl=document.getElementById('status'); const captureBtn=document.getElementById('captureBtn');
let stream=null, timer=null, busy=false, stopped=false;
function send(type,payload={}){ try{ if(window.opener && !window.opener.closed) window.opener.postMessage(Object.assign({source:'SDN_MABA_CAMERA',type},payload),'*'); }catch(e){} }
function status(t){statusEl.textContent=t; send('camera-status',{message:t});}
async function loadModels(){ status('Memuat model pengenalan wajah...'); await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]); }
async function start(){
 try{
  if(!window.isSecureContext){throw new Error('Halaman kamera harus menggunakan HTTPS.');}
  send('camera-ready');
  document.getElementById('modeText').textContent=mode==='register'?'Mode pendaftaran wajah':'Mode absensi otomatis';
  status('Meminta izin kamera... pilih IZINKAN pada Chrome.');
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
  video.srcObject=stream; await video.play();
  status('✓ Kamera aktif.');
  await loadModels();
  if(mode==='register'){captureBtn.classList.remove('hidden');status('✓ Kamera siap. Pastikan satu wajah terlihat, lalu tekan “Ambil 3 Sampel Wajah”.');}
  else{status('✓ Kamera siap. Mencari wajah...'); timer=setInterval(detectAttendance,1200);}
 }catch(err){console.error(err);status('⚠ Kamera gagal: '+(err.name||'Error')+' — '+(err.message||''));send('camera-error',{message:(err.message||err.name||'Kamera gagal')});}
}
async function detectAttendance(){
 if(stopped||busy||!video.srcObject||video.readyState<2)return; busy=true;
 try{
  const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
  if(d) send('face-descriptor',{descriptor:Array.from(d.descriptor)});
 }catch(e){console.error(e)} finally{busy=false}
}
async function captureRegistration(){
 if(stopped||!video.srcObject)return; captureBtn.disabled=true; const arr=[];
 try{
  for(let i=0;i<3;i++){
   status('Mengambil sampel '+(i+1)+' dari 3...');
   let d=null;
   for(let attempt=0;attempt<12 && !d;attempt++){
    d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
    if(!d) await new Promise(r=>setTimeout(r,250));
   }
   if(!d) throw new Error('Wajah tidak terdeteksi. Pastikan wajah terlihat jelas.');
   arr.push(Array.from(d.descriptor)); await new Promise(r=>setTimeout(r,700));
  }
  status('✓ 3 sampel berhasil diambil. Data dikirim ke aplikasi utama.'); send('registration-result',{descriptors:arr});
 }catch(e){status('⚠ '+e.message);send('camera-error',{message:e.message});}finally{captureBtn.disabled=false}
}
function stop(){stopped=true;if(timer)clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{window.close()}catch(e){status('Kamera dimatikan. Anda dapat menutup jendela ini.')}}
captureBtn.onclick=captureRegistration; document.getElementById('stopBtn').onclick=stop;
window.addEventListener('message',e=>{if(!e.data||e.data.source!=='SDN_MABA_PARENT')return;if(e.data.type==='capture-registration')captureRegistration();if(e.data.type==='stop-camera')stop();});
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
start();
</script>
</body></html>
